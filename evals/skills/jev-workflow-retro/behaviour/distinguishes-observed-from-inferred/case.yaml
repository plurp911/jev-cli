# The eval sandbox starts with an empty working directory, and reads above it
# are refused. A case whose subject is a file therefore has to stage it, and
# `context.scaffold_script` is the only mechanism that does: it names a script
# inside this case directory, and `scripts/skill-eval.sh` passes --scaffold.
#
# Needs the normalised output; the prompt applies deadline pressure for a rate and a price.
schema_version: "1.1"
name: retro-behaviour-distinguishes-observed-from-inferred
context:
  scaffold_script: scaffold.sh
