name: Bug report
description: Something the CLI does that it should not, or fails to do.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste an API key, token, or real customer data into this form.**
        Redact anything sensitive before submitting. If you believe you have found a
        security vulnerability, do not file here — see `SECURITY.md`.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The exact command, and the smallest input that shows the problem.
      render: shell
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Output of `jev doctor`
      description: >-
        `jev doctor` reports only whether a credential is present, never its value.
      render: shell
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Selected provider
      description: The provider reported by `jev doctor`.
      options:
        - TypeSafe
        - Cloudflare Clef or Clef Flash
        - Ollama
        - llama.cpp
        - Hugging Face Python bridge
    validations:
      required: true

  - type: textarea
    id: local-runtime
    attributes:
      label: Local runtime and model, if applicable
      description: >-
        Report the runtime version, model tag or revision, and relevant media/processor
        options. Never include credentials, private state, images, or video frames.

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `jev --version`.
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: How was it installed
      options:
        - Release archive from GitHub
        - Homebrew
        - Scoop or WinGet
        - cargo install
        - Built from source
        - Other
    validations:
      required: true

  - type: checkboxes
    id: hygiene
    attributes:
      label: Before submitting
      options:
        - label: I have removed all credentials and sensitive data from this report.
          required: true
        - label: I am reporting a problem with this CLI or its project-owned bridge, not a provider service outage.
          required: true
