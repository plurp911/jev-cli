[package]
name = "jev-client"
description = "Transport-agnostic TypeSafe, Cloudflare, and local decision client for the unofficial Jev CLI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = ["http"]
# The concrete blocking HTTPS transport. Separable so that the request-shaping, retry,
# and decoding logic can be built and tested with no networking code linked at all.
http = ["dep:ureq"]
# Exposes the in-memory transport doubles so downstream crates can test request and
# response handling without a network. Never enabled in a release build.
testing = []

[lints]
workspace = true

[dependencies]
jev-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ureq = { workspace = true, optional = true }
zeroize = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
