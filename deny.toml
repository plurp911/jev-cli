# cargo-deny policy. See `docs/adr/0004-dependency-policy.md`.
#
# This file is the enforcement point for the dependency policy. Relaxing anything here
# is a reviewable security decision, not a build fix. Every exception must carry a
# comment saying who accepted the risk and why.

[graph]
all-features = true
# The platforms `jev` ships for. Keeping this list tight stops the policy from being
# evaluated against dependency trees we never build.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Security advisories (RustSec). This is why the project does not separately run
# cargo-audit: cargo-deny consults the same advisory database in the same CI job.
# ---------------------------------------------------------------------------
[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

# ---------------------------------------------------------------------------
# Licenses. A permissively licensed CLI must not acquire a copyleft obligation
# through a transitive dependency.
# ---------------------------------------------------------------------------
[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    # A permissive *data* licence, not a code licence and not copyleft. It covers
    # `webpki-roots`, which is the Mozilla CA certificate set that `rustls` verifies
    # against. Accepted deliberately: the allow-list exists to stop a copyleft
    # obligation arriving transitively, and CDLA-Permissive-2.0 imposes none. The
    # alternative -- verifying against the platform trust store -- is a considerably
    # larger dependency tree for the same result.
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93
exceptions = []

# ---------------------------------------------------------------------------
# Bans. Duplicate versions and heavyweight transitive pulls are both a supply-chain
# surface and a binary-size problem.
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
    # Unmaintained TLS stack. `jev` uses rustls; see ADR-0004.
    { crate = "openssl", reason = "use rustls; avoid a system OpenSSL dependency" },
    { crate = "openssl-sys", reason = "use rustls; avoid a system OpenSSL dependency" },
    # An async runtime is a deliberate architectural choice, not something a
    # dependency may introduce silently. ADR-0007 keeps the CLI blocking; ADR-0012
    # admits tokio for `jev mcp serve` only, as a dependency of the official MCP SDK and
    # of `jev-cli`'s MCP module -- and of nothing else, so it still cannot arrive
    # through any other crate.
    # `tokio-stream` and `process-wrap` come only with rmcp's client features, which
    # `jev-cli` enables for its tests alone (`tests/mcp.rs`); neither is in the release
    # graph, which `cargo tree -e normal -i tokio` shows.
    { crate = "tokio", wrappers = ["jev-cli", "rmcp", "tokio-util", "tokio-stream", "process-wrap"], reason = "confined to `jev mcp serve` by ADR-0012; blocking everywhere else by ADR-0007" },
    # Anything that shells out or loads native plugins widens the attack surface.
    { crate = "libloading", reason = "no dynamic plugin loading in the core CLI" },
]
skip = []
skip-tree = []

# ---------------------------------------------------------------------------
# Sources. Only crates.io. A git or path dependency in the release graph would make
# builds non-reproducible and unauditable.
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
